<!doctype html>
<html lang="en">

<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.back{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
/* layout: one 9:16 film stage, transport controls under it, script below. single dark look on purpose (it is a video frame). */
:root{
  --bg:#0a0e18; --stage:#101624; --stage-2:#19213a; --screen:#090d16; --line:#2e3956;
  --ink:#e9edf5; --muted:#8f9bb5;
  --paper:#eef0f4; --paper-2:#dde1e9; --paper-ink:#1b2130; --paper-bar:#c2c7d2; --hl:#f6c744; --mark:#e0522e;
  --online:#f0a63a; --offline:#4cc4dc; --target:#b59af2; --loss:#f2766b;
  --font-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:18px 32px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:stretch}
header h1{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.stagebox{display:flex;justify-content:center}
canvas{display:block;width:min(100%, max(250px, calc((100dvh - 150px) * 0.5625)));aspect-ratio:9/16;max-width:100%;
  background:var(--stage);border-radius:14px;border:1px solid var(--line);cursor:pointer}
.transport{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.transport input[type=range]{flex:1 1 110px;min-width:0;accent-color:var(--online)}
.time{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,summary:focus-visible,canvas:focus-visible{outline:2px solid var(--online);outline-offset:2px}
#play{min-width:76px;background:var(--stage-2);font-weight:600}
.scenes{display:flex;flex-wrap:wrap;gap:6px}
.scenes button{font-size:12.5px;padding:4px 10px;color:var(--muted)}
.scenes button[aria-current="true"]{color:var(--ink);background:var(--stage-2);border-color:var(--online)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:13.5px}
ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
ol b{font-family:var(--font-display);font-weight:600}
ol span{display:block;color:var(--muted);font-size:13.5px;max-width:65ch}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="back" href="../">&larr; Concepts</a>
    <h1>DQN Paper Reel</h1>
    <p>Mnih et al., Nature 2015, rebuilt one part at a time. Tap the frame to pause.</p>
  </header>
  <div class="stagebox"><canvas id="stage" tabindex="0" role="img" aria-label="Animated walkthrough of the DQN paper. The script is listed below."></canvas></div>
  <div class="transport">
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" min="0" max="100" step="0.01" value="0" aria-label="Position in the reel">
    <span class="time" id="time">0:00</span>
    <button id="snd" type="button" aria-pressed="false">Sound off</button>
  </div>
  <div class="scenes" id="scenes" aria-label="Jump to a scene"></div>
  <details>
    <summary>Script, scene by scene</summary>
    <ol id="script"></ol>
  </details>
</div>

<script>
(() => {
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const W = 540, H = 960, OP = 2.3;
const cs = getComputedStyle(document.documentElement);
const C = {};
['bg','stage','stage-2','screen','line','ink','muted','paper','paper-2','paper-ink','paper-bar','hl','mark','online','offline','target','loss']
  .forEach(k => C[k.replace('-', '_')] = cs.getPropertyValue('--' + k).trim());
const F = { d: '"Source Serif 4", Georgia, serif', b: '"IBM Plex Sans", system-ui, sans-serif', m: '"IBM Plex Mono", ui-monospace, Menlo, monospace' };

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (u, a, b) => clamp((u - a) / (b - a));
const rnd = i => { const v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const tri = v => { v = v - Math.floor(v); return 1 - Math.abs(v * 2 - 1); };
function ca(hex, a) { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
function A(a, fn) { if (a <= 0.004) return; ctx.save(); ctx.globalAlpha *= clamp(a); fn(); ctx.restore(); }
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function T(s, x, y, o = {}) {
  ctx.font = (o.w || 400) + ' ' + (o.s || 14) + 'px ' + (o.f || F.b);
  ctx.fillStyle = o.c || C.ink; ctx.textAlign = o.a || 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y);
}
function wrap(s, x, y, maxW, lh, o) {
  ctx.font = (o.w || 400) + ' ' + (o.s || 14) + 'px ' + (o.f || F.b);
  const words = s.split(' '); let ln = '';
  for (const w of words) {
    const t = ln ? ln + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && ln) { T(ln, x, y, o); y += lh; ln = w; } else ln = t;
  }
  if (ln) { T(ln, x, y, o); y += lh; }
  return y;
}
function pat(p, k) {
  let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
  let d = L * clamp(k);
  for (let i = 1; i < p.length; i++) {
    const s = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (d <= s || i === p.length - 1) { const f = s ? clamp(d / s) : 0; return [lerp(p[i - 1][0], p[i][0], f), lerp(p[i - 1][1], p[i][1], f)]; }
    d -= s;
  }
  return p[0];
}
function line(p, col, o = {}) {
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = o.lw || 1.5; if (o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.stroke();
  ctx.setLineDash([]);
  const [x2, y2] = p[p.length - 1], [x1, y1] = p[p.length - 2], an = Math.atan2(y2 - y1, x2 - x1);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 9 * Math.cos(an - .42), y2 - 9 * Math.sin(an - .42)); ctx.lineTo(x2 - 9 * Math.cos(an + .42), y2 - 9 * Math.sin(an + .42));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function dot(x, y, col, r = 6) {
  ctx.fillStyle = ca(col, .25); ctx.beginPath(); ctx.arc(x, y, r + 5, 0, 7); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function tok(p, k, col, label, side) {
  if (k <= 0 || k >= 1) return;
  const [x, y] = pat(p, ease(k)); dot(x, y, col);
  if (label) T(label, side === 'l' ? x - 14 : x + 14, y + 4, { f: F.m, s: 11.5, c: col, w: 500, a: side === 'l' ? 'right' : 'left' });
}
function box(b, col, label, o = {}) {
  rr(b[0], b[1], b[2], b[3], 10); ctx.fillStyle = o.fill || C.stage_2; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = col; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); ctx.setLineDash([]);
  if (label) T(label, b[0] + 2, b[1] - 8, { f: F.m, s: 11, c: col, w: 500 });
}
function flash(b, col, a) { A(a, () => { rr(b[0] - 3, b[1] - 3, b[2] + 6, b[3] + 6, 12); ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke(); }); }
function net(x, y, w, h, col) {
  const L = [3, 4, 3], pts = L.map((n, i) => Array.from({ length: n }, (_, j) => [x + w * (i / 2), y + h * ((j + .5) / n)]));
  ctx.strokeStyle = ca(col, .28); ctx.lineWidth = 1;
  for (let i = 0; i < 2; i++) for (const a of pts[i]) for (const b of pts[i + 1]) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  ctx.fillStyle = col; for (const l of pts) for (const a of l) { ctx.beginPath(); ctx.arc(a[0], a[1], 3.2, 0, 7); ctx.fill(); }
}
function game(x, y, w, h, u) {
  rr(x, y, w, h, 6); ctx.fillStyle = C.screen; ctx.fill();
  const bw = (w - 14) / 6, bh = h * .08, gone = Math.floor(u / 2.6) % 7, cols = [C.loss, C.online, C.offline];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) {
    if (r === 2 && c < gone) continue;
    ctx.fillStyle = ca(cols[r], .8); ctx.fillRect(x + 7 + c * bw + 1.5, y + 8 + r * (bh + 3), bw - 3, bh);
  }
  const bx = x + 12 + tri(u * .31) * (w - 24), by = y + h * .42 + tri(u * .47 + .3) * (h * .4);
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(bx, by, Math.max(2.2, w * .016), 0, 7); ctx.fill();
  ctx.fillRect(bx - w * .09, y + h - 9, w * .18, 3.5);
}

/* ---------- the paper (redrawn page, text shown as bars except the parts we zoom into) ---------- */
const ALGO = ['init memory D, weights θ, target θ⁻ ← θ', 'for each step t:', '  a ← ε-greedy over Q(s, · ; θ)', '  play a, observe r and s′',
  '  store (s, a, r, s′) in D', '  sample a random minibatch from D', '  y ← r + γ maxₐ Q̂(s′, a ; θ⁻)', '  gradient step on (y − Q(s, a ; θ))²', '  every C steps: θ⁻ ← θ'];
const REG = { loop: [24, 137, 168, 14], qnet: [24, 262, 168, 116], replay: [208, 152, 168, 14], target: [208, 218, 168, 14], loss: [206, 381, 172, 13], full: [204, 284, 176, 128] };
function viewFor(reg, k) {
  const s1 = reg ? Math.min(470 / reg[2], 400 / reg[3], 3.4) : 1;
  const s = Math.exp(Math.log(s1) * k), cx = lerp(200, reg ? reg[0] + reg[2] / 2 : 200, k), cy = lerp(260, reg ? reg[1] + reg[3] / 2 : 260, k);
  return { x: 270 - cx * s, y: 356 - cy * s, s };
}
function bars(x, y, w, n, seed) {
  ctx.fillStyle = C.paper_bar;
  for (let j = 0; j < n; j++) ctx.fillRect(x, y + j * 5, j === n - 1 ? w * (.35 + .4 * rnd(seed + j)) : w * (.9 + .1 * rnd(seed + j * 3)), 2.2);
}
function chip(r, s) { ctx.fillStyle = ca(C.hl, .6); ctx.fillRect(r[0], r[1], r[2], r[3]); T(s, r[0] + 3, r[1] + r[3] - 4.2, { f: F.d, s: 6.6, w: 600, c: C.paper_ink }); }
function ring(r, a) { A(a, () => { ctx.strokeStyle = C.mark; ctx.lineWidth = 1.3; rr(r[0] - 3, r[1] - 3, r[2] + 6, r[3] + 6, 2.5); ctx.stroke(); }); }
function paper(v, reg, ra, all) {
  const ink = C.paper_ink;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 88, W, 538); ctx.clip();
  ctx.translate(v.x, v.y); ctx.scale(v.s, v.s);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(4, 5, 400, 520);
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, 400, 520);
  T('LETTER', 24, 22, { f: F.d, w: 700, s: 7, c: ink }); T('Nature 518, 529–533 (2015)', 376, 22, { f: F.d, s: 5.6, c: ink, a: 'right' });
  ctx.fillStyle = ink; ctx.fillRect(24, 27, 352, .6);
  T('Human-level control through deep', 24, 50, { f: F.d, w: 700, s: 16.5, c: ink });
  T('reinforcement learning', 24, 69, { f: F.d, w: 700, s: 16.5, c: ink });
  T('Volodymyr Mnih, Koray Kavukcuoglu, David Silver, Andrei A. Rusu, Joel Veness,', 24, 84, { f: F.d, s: 6, c: ink });
  T('Marc G. Bellemare, Alex Graves, Martin Riedmiller … Demis Hassabis', 24, 93, { f: F.d, s: 6, c: ink });
  ctx.fillStyle = ink; ctx.fillRect(24, 102, 352, .4);
  // left column
  bars(24, 112, 168, 4, 1); chip(REG.loop, 'reinforcement learning: agent ↔ environment'); bars(24, 159, 168, 18, 2);
  ctx.strokeStyle = ink; ctx.lineWidth = .5; ctx.strokeRect(24, 262, 168, 104);
  for (let i = 0; i < 3; i++) { ctx.fillStyle = C.paper_2; ctx.fillRect(38 + i * 4, 290 + i * 4, 30, 30); ctx.strokeRect(38 + i * 4, 290 + i * 4, 30, 30); }
  [[92, 46], [108, 36], [124, 26], [142, 40]].forEach(([x, h], i) => { ctx.fillStyle = i === 3 ? ca(C.target, .7) : ca(C.offline, .6); ctx.fillRect(x, 314 - h / 2, i === 3 ? 5 : 10, h); ctx.strokeRect(x, 314 - h / 2, i === 3 ? 5 : 10, h); });
  [1.2, 2, .7, 1.5].forEach((q, i) => { ctx.fillStyle = ink; ctx.fillRect(158, 297 + i * 10, q * 10, 4); });
  ctx.fillStyle = ink; ctx.fillRect(80, 313.7, 9, .6); ctx.fillRect(149, 313.7, 7, .6);
  T('pixels', 38, 342, { f: F.d, s: 5, c: ink }); T('layers', 100, 348, { f: F.d, s: 5, c: ink }); T('Q per action', 150, 342, { f: F.d, s: 5, c: ink });
  T('Figure 1 | The deep Q-network', 24, 376, { f: F.d, w: 600, s: 5.8, c: ink });
  bars(24, 388, 168, 23, 3);
  // right column
  T('METHODS', 208, 117, { f: F.d, w: 700, s: 6.5, c: ink }); bars(208, 124, 168, 5, 4);
  chip(REG.replay, 'experience replay: store, then sample at random'); bars(208, 173, 168, 8, 5);
  chip(REG.target, 'target network Q̂: a periodically updated copy'); bars(208, 239, 168, 8, 6);
  ctx.fillStyle = C.paper_2; ctx.fillRect(204, 284, 176, 128); ctx.strokeStyle = ink; ctx.lineWidth = .5; ctx.strokeRect(204, 284, 176, 128);
  T('Algorithm 1 · deep Q-learning with experience replay', 209, 296, { f: F.d, w: 700, s: 5.6, c: ink });
  ALGO.forEach((l, j) => T(l, 210, 309 + j * 11.6, { f: F.m, s: 5.3, c: ink }));
  bars(208, 420, 168, 17, 7);
  if (all) Object.keys(REG).forEach((k, i) => { if (k !== 'loss') ring(REG[k], ra * seg(all, i * .7, i * .7 + .5)); });
  else if (reg) ring(reg, ra);
  ctx.restore();
}

/* ---------- scene 1: the loop ---------- */
function sLoop(u) {
  const env = [150, 124, 240, 168], ag = [170, 444, 200, 104], PL = [[215, 292], [215, 444]], PR = [[325, 444], [325, 292]];
  const n = Math.floor(u / 2.6), p = (u % 2.6) / 2.6;
  box(env, C.ink, 'Environment (the game) · score ' + n); game(162, 136, 216, 144, u);
  box(ag, C.ink, 'Agent'); net(215, 462, 110, 68, C.ink);
  line(PL, C.online); line(PR, C.online);
  T('state s', 201, 350, { a: 'right', w: 600, s: 15 }); T('what the screen shows', 201, 367, { a: 'right', s: 11.5, c: C.muted });
  T('reward r', 201, 400, { a: 'right', w: 600, s: 15, c: C.loss }); T('+1 for a broken brick', 201, 417, { a: 'right', s: 11.5, c: C.muted });
  T('action a', 339, 372, { w: 600, s: 15 }); T('left, right, fire…', 339, 389, { s: 11.5, c: C.muted });
  tok(PL, seg(p, .1, .5), C.loss, 'r'); tok(PL, seg(p, 0, .4), C.online, 's'); tok(PR, seg(p, .52, .9), C.online, 'a', 'l');
}

/* ---------- scene 2: the Q-network ---------- */
function sQnet(u) {
  for (let i = 0; i < 4; i++) { rr(222 + i * 7, 110 + i * 7, 78, 78, 5); ctx.fillStyle = C.stage_2; ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 1.2; ctx.stroke(); }
  game(243, 131, 78, 78, u);
  T('state s', 340, 152, { w: 600, s: 15 }); T('the last 4 frames,', 340, 170, { s: 11.5, c: C.muted }); T('84 × 84 pixels each', 340, 186, { s: 11.5, c: C.muted });
  line([[270, 216], [270, 236]], C.muted);
  T('Q-network', 120, 234, { f: F.m, s: 11, w: 500 });
  const wave = (u * .9) % 1.7;
  [[300, 'conv 8×8, 32 filters'], [236, 'conv 4×4, 64 filters'], [172, 'conv 3×3, 64 filters'], [130, 'dense, 512 units']].forEach(([w, s], j) => {
    const g = clamp(1 - Math.abs(wave - j * .28 - .2) / .28);
    rr(270 - w / 2, 240 + j * 30, w, 24, 6); ctx.fillStyle = C.stage_2; ctx.fill(); ctx.strokeStyle = ca(C.ink, .35 + .65 * g); ctx.lineWidth = 1.5; ctx.stroke();
    T(s, 270, 256.5 + j * 30, { a: 'center', f: F.m, s: 11, c: C.ink });
  });
  line([[270, 358], [270, 378]], C.muted);
  A(seg(u, 1.4, 2), () => T('Q(s, a): expected future reward per action', 270, 398, { a: 'center', f: F.m, s: 11.5, c: C.muted }));
  const grow = ease(seg(u, 2, 3.6)), pick = seg(u, 4.6, 5.1), exp = seg(u, 7.2, 7.7);
  [['left', 1.2], ['right', 2.0], ['fire', 0.7], ['stay', 1.5]].forEach(([nm, q], i) => {
    const y = 414 + i * 36, w = q / 2.2 * 250 * grow, best = i === 1;
    T(nm, 150, y + 15, { a: 'right', s: 15, w: 500 });
    rr(162, y, Math.max(2, w), 20, 4); ctx.fillStyle = best ? ca(C.ink, lerp(.5, .95, pick)) : ca(C.ink, .45); ctx.fill();
    A(grow, () => T(q.toFixed(1), 170 + w, y + 15, { f: F.m, s: 13 }));
    if (best) A(pick, () => T('take this one', 432, y + 15, { s: 13, w: 600, a: 'left' }));
    if (i === 2) A(exp, () => {
      ctx.setLineDash([4, 4]); rr(158, y - 4, w + 8, 28, 6); ctx.strokeStyle = C.muted; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
      T('sometimes a random one (ε)', 292, y + 15, { s: 12.5, c: C.muted });
    });
  });
  A(seg(u, 8, 8.6), () => T('ε starts at 1.0 and decays to 0.1', 270, 584, { a: 'center', f: F.m, s: 11.5, c: C.muted }));
}

/* ---------- scenes 3 to 7: the system ---------- */
const ENV = [24, 118, 160, 112], QN = [340, 118, 180, 112], BUF = [24, 312, 226, 128], TG = [330, 322, 136, 98], LS = [300, 500, 220, 100];
const P = { s: [[184, 146], [340, 146]], a: [[340, 196], [184, 196]], st: [[104, 230], [104, 312]], bq: [[250, 336], [300, 290], [372, 230]],
  bt: [[250, 384], [330, 384]], y: [[398, 420], [398, 500]], q: [[484, 230], [484, 500]], g: [[512, 500], [512, 230]], cp: [[430, 230], [430, 322]] };
const slot = i => [29 + (i % 11) * 20, 324 + Math.floor(i / 11) * 20];
function picks(seed, count, f) { return Array.from({ length: f }, (_, i) => i).sort((a, b) => rnd(seed * 17 + a * 3.1) - rnd(seed * 17 + b * 3.1)).slice(0, count); }
function numline(qv, errA) {
  const X = v => 318 + (v - 2.3) / .8 * 184;
